<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Circular Path for Top Text -->
    <path id="textPathTop" d="M 70,250 A 180,180 0 1,1 430,250" />
    <!-- Circular Path for Bottom Text -->
    <path id="textPathBottom" d="M 430,250 A 180,180 0 0,1 70,250" />
    
    <!-- Red Sun Gradient -->
    <radialGradient id="redSunGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EF233C"/>
      <stop offset="85%" stop-color="#D90429"/>
      <stop offset="100%" stop-color="#B7021E"/>
    </radialGradient>

    <!-- Brush Ring Texture Mask -->
    <filter id="brushFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="6" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>

  <!-- Outer White Badge Base -->
  <circle cx="250" cy="250" r="235" fill="#FAF8F5" stroke="#111827" stroke-width="4" />

  <!-- Inner Red Sun Circle with Brush Edge -->
  <circle cx="250" cy="250" r="150" fill="url(#redSunGrad)" filter="url(#brushFilter)" />

  <!-- Top Text: ISSHONI NIHONGO -->
  <text font-family="'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="36" fill="#0F172A" letter-spacing="7">
    <textPath href="#textPathTop" startOffset="50%" text-anchor="middle">
      ISSHONI NIHONGO
    </textPath>
  </text>

  <!-- Bottom Text: 一緒に日本語 -->
  <text font-family="'Noto Serif JP', 'Yu Mincho', 'Sawarabi Mincho', serif" font-weight="900" font-size="34" fill="#0F172A" letter-spacing="8">
    <textPath href="#textPathBottom" startOffset="50%" text-anchor="middle">
      一緒に日本語
    </textPath>
  </text>

  <!-- Silhouette Landscape & Torii Gate inside the Red Sun -->
  <g fill="#0B0F19">
    <!-- Distant Mountain/Fuji Contour -->
    <path d="M 115 310 Q 180 270 250 280 Q 320 275 385 310 Z" opacity="0.6" />

    <!-- Main Torii Gate (鳥居) -->
    <!-- Kasagi & Shimaki (Top Curved Double Lintels) -->
    <path d="M 170 195 Q 250 185 330 195 L 335 205 Q 250 196 165 205 Z" />
    <path d="M 180 210 L 320 210 L 320 218 L 180 218 Z" />

    <!-- Nuki (Second Horizontal Beam) -->
    <path d="M 175 235 L 325 235 L 325 243 L 175 243 Z" />

    <!-- Gakuzuka (Center Strut) -->
    <rect x="245" y="210" width="10" height="25" />

    <!-- Pillar Hashira Left -->
    <path d="M 200 210 L 195 350 L 213 350 L 210 210 Z" />
    <!-- Pillar Hashira Right -->
    <path d="M 290 210 L 287 350 L 305 350 L 300 210 Z" />

    <!-- Pillar Bases (Daiishi) -->
    <rect x="190" y="342" width="28" height="12" rx="2" />
    <rect x="282" y="342" width="28" height="12" rx="2" />

    <!-- Left Pine Tree (松) -->
    <path d="M 110 320 Q 120 290 145 285 Q 165 280 170 300 M 120 280 Q 130 250 155 255 Q 170 260 160 280 M 105 350 C 120 340 140 310 155 350 Z" />
    <circle cx="130" cy="270" r="18" />
    <circle cx="150" cy="255" r="22" />
    <circle cx="120" cy="295" r="16" />
    <circle cx="165" cy="280" r="18" />

    <!-- Right Pine Tree (松) -->
    <path d="M 390 320 Q 380 290 355 285 Q 335 280 330 300 M 380 280 Q 370 250 345 255 Q 330 260 340 280 M 395 350 C 380 340 360 310 345 350 Z" />
    <circle cx="370" cy="270" r="18" />
    <circle cx="350" cy="255" r="22" />
    <circle cx="380" cy="295" r="16" />
    <circle cx="335" cy="280" r="18" />

    <!-- Traditional Wooden Fencing & Bridge Railings -->
    <!-- Left Fence -->
    <path d="M 120 330 L 190 330 L 190 335 L 120 335 Z" />
    <path d="M 120 340 L 190 340 L 190 345 L 120 345 Z" />
    <rect x="130" y="325" width="4" height="25" />
    <rect x="150" y="325" width="4" height="25" />
    <rect x="170" y="325" width="4" height="25" />

    <!-- Right Fence -->
    <path d="M 310 330 L 380 330 L 380 335 L 310 335 Z" />
    <path d="M 310 340 L 380 340 L 380 345 L 310 345 Z" />
    <rect x="330" y="325" width="4" height="25" />
    <rect x="350" y="325" width="4" height="25" />
    <rect x="370" y="325" width="4" height="25" />

    <!-- Ground / Water Shoreline Base Silhouette -->
    <path d="M 100 345 Q 250 330 400 345 L 400 370 Q 250 380 100 370 Z" />
  </g>
</svg>
